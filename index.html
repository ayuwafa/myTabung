<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>myTabung 🌷</title><style>*{box-sizing:border-box}body{margin:0;background:#faf5f8;color:#493d55;font:16px system-ui,sans-serif}main{max-width:650px;margin:auto;padding:22px 16px 60px}h1{margin:0;font-size:34px}h2{font-size:19px}p{line-height:1.5}.muted{color:#786d80;font-size:13px}.card{background:white;border:1px solid #eee4ed;border-radius:24px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #7457780a}.hero{background:linear-gradient(135deg,#e9defa,#fce0e8)}.money{font-size:34px;font-weight:800;margin:8px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}button,input,select{font:inherit;border-radius:12px;padding:12px;border:1px solid #dfd5e5}button{cursor:pointer;background:#e9defa;color:#493d55;font-weight:650}button.primary{background:#76549b;color:white;border:0}button.small{font-size:13px;padding:8px 10px}input,select{width:100%;background:#fff;color:inherit}label{display:block;margin:12px 0 5px;font-size:14px} .bar{display:flex;height:13px;border-radius:20px;overflow:hidden;background:#eae4ed}.jar{border-radius:20px;padding:17px;margin:12px 0}.jar h3{margin:0}.jar .money{font-size:26px}.free{background:#dff3e7}.bad{background:#ffe0df}.entry{padding:12px 0;border-bottom:1px solid #eee}.entry:last-child{border:0}dialog{border:0;border-radius:24px;width:min(92%,440px);padding:22px;color:inherit}dialog::backdrop{background:#33243d66}footer{text-align:center}.grow{flex:1}button:focus-visible{outline:3px solid #b59bd3}</style><main><div class="row between"><div><h1>myTabung 🌷</h1><div class="muted">Duit tersusun, hati tenang.</div></div><button class="small" onclick="openForm('bank')">⚙ Baki bank</button></div><section class="card hero"><div>💳 Jumlah duit dalam bank</div><div class="money" id="bank"></div><div class="bar" id="bar"></div><p id="allocated" class="muted"></p></section><section class="card free" id="freecard"><div>🌿 Baki bebas dibelanjakan</div><div class="money" id="free"></div><div id="hint" class="muted"></div></section><div class="row"><button class="primary grow" onclick="openForm('spend')">− Belanja</button><button class="grow" onclick="openForm('income')">+ Duit masuk</button></div><div class="row between"><h2>🧸 Tabung saya</h2><button onclick="openForm('add')">+ Tabung baru</button></div><div id="jars"></div><section class="card"><div class="row between"><h2>📝 Rekod transaksi</h2><button class="small" onclick="backup()">Backup</button></div><div id="history"></div></section><footer class="muted">Data disimpan dalam browser ini sahaja.<br>Tiada sambungan ke akaun bank.<p><button class="small" onclick="document.getElementById('restore').click()">Pulihkan backup</button> <input type="file" id="restore" accept=".json" hidden style="display:none" onchange="restore(this)"></p></footer></main><dialog id="dlg"><form id="form"><h2 id="heading"></h2><div id="fields"></div><p id="err" style="color:#a32e48"></p><div class="row"><button type="button" onclick="dlg.close()">Batal</button><button class="primary grow">Simpan</button></div></form></dialog><script>const $=id=>document.getElementById(id), colors=['#e8def8','#f9dce6','#d9f1e5','#fce9c9','#dceaf9'];let s;try{s=JSON.parse(localStorage.getItem('mytabung-v1'))}catch{};s=s||{bank:0,jars:[],history:[]};const rm=n=>new Intl.NumberFormat('ms-MY',{style:'currency',currency:'MYR'}).format(n/100),sum=()=>s.jars.reduce((a,j)=>a+j.amount,0),free=()=>s.bank-sum(),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){try{localStorage.setItem('mytabung-v1',JSON.stringify(s))}catch{alert('Browser tidak dapat menyimpan data. Sila buat backup.')} $('bank').textContent=rm(s.bank);$('free').textContent=rm(free());$('allocated').textContent='Diperuntukkan: '+rm(sum());$('freecard').className='card '+(free()<0?'bad':'free');$('hint').textContent=free()<0?'Peruntukan melebihi baki bank. Laraskan tabung.':free()===0?'Tiada baki bebas.':'Boleh digunakan tanpa mengusik tabung.';$('bar').innerHTML=s.jars.map((j,i)=>`<div style="background:${colors[i%5]};width:${j.amount/Math.max(s.bank,sum(),1)*100}%"></div>`).join('');$('jars').innerHTML=s.jars.length?s.jars.map((j,i)=>`<div class="jar" style="background:${colors[i%5]}"><div class="row between"><h3>${esc(j.icon)} ${esc(j.name)}</h3><button class="small" onclick="openForm('edit',${i})">✎ Edit</button></div><div class="money">${rm(j.amount)}</div><div class="row"><button class="small" onclick="openForm('allocate',${i})">+ Isi tabung</button><button class="small" onclick="openForm('release',${i})">− Keluarkan</button><button class="small" onclick="removeJar(${i})">Padam</button></div></div>`).join(''):'<div class="card muted">Belum ada tabung. Tetapkan baki bank dan cipta tabung pertama!</div>';$('history').innerHTML=s.history.length?s.history.map(h=>`<div class="entry"><div class="row between"><strong>${esc(h.label)}</strong><span>${rm(h.amount)}</span></div><div class="muted">${esc(h.date)}</div></div>`).join(''):'<p class="muted">Belum ada transaksi.</p>'}let mode,idx;const amount=(v='')=>`<label>Jumlah (RM)</label><input id="amt" type="number" min="0" step="0.01" required value="${v}" placeholder="0.00">`,nameField=(j={})=>`<label>Nama tabung</label><input id="nm" required maxlength="50" value="${esc(j.name||'')}" placeholder="Contoh: Percutian"><label>Emoji</label><input id="emoji" maxlength="12" value="${esc(j.icon||'🐷')}">`;function openForm(m,i){mode=m;idx=i;let j=s.jars[i];$('heading').textContent=({bank:'Kemaskini baki bank',add:'Tabung baru',edit:'Edit tabung',spend:'Catat perbelanjaan',income:'Duit masuk',allocate:'Isi tabung',release:'Kembalikan ke baki bebas'})[m];$('fields').innerHTML=m==='bank'?amount(s.bank/100):m==='add'?nameField()+amount(0):m==='edit'?nameField(j)+amount(j.amount/100):m==='spend'?amount()+`<label>Guna duit daripada</label><select id="source"><option value="free">Baki bebas (${rm(free())})</option>${s.jars.map((j,i)=>`<option value="${i}">${esc(j.name)} (${rm(j.amount)})</option>`).join('')}</select><label>Catatan</label><input id="note" placeholder="Contoh: Barang dapur">`:amount();$('err').textContent='';$('dlg').showModal()}function log(label,amount){s.history.unshift({label,amount,date:new Date().toLocaleString('ms-MY')})}function fail(t){$('err').textContent=t} $('form').onsubmit=e=>{e.preventDefault();let a=Math.round(Number($('amt').value)*100),j=s.jars[idx];if(!Number.isSafeInteger(a)||a<0)return fail('Jumlah tidak sah.');if(mode==='bank'){log('Pelarasan baki bank',a-s.bank);s.bank=a}else if(mode==='add'||mode==='edit'){let old=j?.amount||0;if(a>old+Math.max(0,free()))return fail('Baki bebas tidak mencukupi.');let name=$('nm').value.trim();if(!name)return fail('Masukkan nama tabung.');let item={name,icon:$('emoji').value||'🐷',amount:a};if(mode==='add')s.jars.push(item);else s.jars[idx]=item;log('Peruntukan: '+name,a-old)}else if(mode==='income'){if(!a)return fail('Masukkan jumlah positif.');s.bank+=a;log('Duit masuk',a)}else if(mode==='spend'){let src=$('source').value;if(!a||a>s.bank||a>(src==='free'?free():s.jars[+src].amount))return fail('Baki sumber tidak mencukupi.');if(src!=='free')s.jars[+src].amount-=a;s.bank-=a;log(($('note').value||'Belanja')+' · '+(src==='free'?'Baki bebas':s.jars[+src].name),-a)}else if(mode==='allocate'){if(!a||a>free())return fail('Baki bebas tidak mencukupi.');j.amount+=a;log('Isi '+j.name,a)}else if(mode==='release'){if(!a||a>j.amount)return fail('Baki tabung tidak mencukupi.');j.amount-=a;log('Kembali dari '+j.name,-a)}$('dlg').close();render()};function removeJar(i){if(confirm('Padam tabung '+s.jars[i].name+'? Duit dikembalikan ke baki bebas.')){log('Padam '+s.jars[i].name,-s.jars[i].amount);s.jars.splice(i,1);render()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='myTabung-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(input){try{let v=JSON.parse(await input.files[0].text()),valid=n=>Number.isSafeInteger(n)&&n>=0;if(!valid(v.bank)||!Array.isArray(v.jars)||!v.jars.every(j=>valid(j.amount)&&typeof j.name==='string'&&typeof j.icon==='string')||!Array.isArray(v.history)||!v.history.every(h=>Number.isSafeInteger(h.amount)&&typeof h.label==='string'&&typeof h.date==='string'))throw Error();if(confirm('Gantikan semua data dengan backup ini?')){s=v;render()}}catch{alert('Fail backup tidak sah.')}input.value=''}render();</script></html>
